[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-api-client"
version = "0.1.1"
description = "Educational command-line HTTP API client built around raw sockets, retries, auth, pagination, and WSGI."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Princeton Afeez" }
]
keywords = ["http", "client", "raw-sockets", "wsgi", "educational", "capstone"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/princetonafeez/simple-api-client"
Documentation = "https://github.com/princetonafeez/simple-api-client/blob/main/docs/architecture.md"
Repository = "https://github.com/princetonafeez/simple-api-client"
Changelog = "https://github.com/princetonafeez/simple-api-client/blob/main/CHANGELOG.md"
Issues = "https://github.com/princetonafeez/simple-api-client/issues"

# Runtime: Python standard library only (no third-party packages).
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[project.scripts]
apiclient = "apiclient.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=apiclient --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["apiclient"]
omit = []

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "server"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
