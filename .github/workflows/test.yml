name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unittest:
    name: unittest discovery
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.14"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile the project
        run: python -m compileall -q src server tests

      - name: Run the unittest suite
        run: |
          python -c "import sys, unittest; sys.path.insert(0, 'src'); \
            result = unittest.TextTestRunner(verbosity=1).run( \
              unittest.defaultTestLoader.discover('tests')); \
            raise SystemExit(0 if result.wasSuccessful() else 1)"

  pytest:
    name: pytest with coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the project with dev extras
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests server

      - name: Run pytest with coverage
        run: pytest -q
